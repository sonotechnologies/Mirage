name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: "Build the Windows installer (downloads ~1.4 GB of models)"
        type: boolean
        default: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy opencv-python-headless onnxruntime pytest
      - name: Unit tests (no models needed; model tests skip)
        run: python -m pytest -q tests
      - name: UI scripts parse
        run: node --check ui/app.js && node --check ui/mock.js

  windows-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: |
          python -m venv .venv
          ./build/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MirageSetup
          path: dist/MirageSetup*.exe
          retention-days: 7
